networks:
  backend_network:
    driver: bridge
  blockchain_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  besu-validator1:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator1
    user: "0"
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/var/lib/besu
      - --static-nodes-file=/opt/besu/static-nodes.json
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=172.28.0.11
      - --p2p-port=30303
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    ports:
      - "30303:30303"
    volumes:
      - besu-data-validator1:/var/lib/besu
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator1/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/static-nodes.json
    networks:
      blockchain_network:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  besu-validator2:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator2
    user: "0"
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/var/lib/besu
      - --static-nodes-file=/opt/besu/static-nodes.json
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=172.28.0.12
      - --p2p-port=30303
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    ports:
      - "30304:30303"
    volumes:
      - besu-data-validator2:/var/lib/besu
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator2/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/static-nodes.json
    networks:
      blockchain_network:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  besu-validator3:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator3
    user: "0"
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/var/lib/besu
      - --static-nodes-file=/opt/besu/static-nodes.json
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=172.28.0.13
      - --p2p-port=30303
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    ports:
      - "30305:30303"
    volumes:
      - besu-data-validator3:/var/lib/besu
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator3/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/static-nodes.json
    networks:
      blockchain_network:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

  besu-validator4:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator4
    user: "0"
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/var/lib/besu
      - --static-nodes-file=/opt/besu/static-nodes.json
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=172.28.0.14
      - --p2p-port=30303
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    ports:
      - "30306:30303"
    volumes:
      - besu-data-validator4:/var/lib/besu
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator4/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/static-nodes.json
    networks:
      blockchain_network:
        ipv4_address: 172.28.0.14
    restart: unless-stopped

  besu-rpc:
    image: hyperledger/besu:23.10.2
    container_name: besu-rpc
    user: "0"
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/var/lib/besu
      - --static-nodes-file=/opt/besu/static-nodes.json
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=172.28.0.15
      - --p2p-port=30303
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=*
      - --host-allowlist=localhost,besu-rpc,backend,127.0.0.1,172.28.0.15
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    ports:
      - "8545:8545"
      - "30307:30303"
    volumes:
      - besu-data-rpc:/var/lib/besu
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/rpc/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/static-nodes.json
    networks:
      blockchain_network:
        ipv4_address: 172.28.0.15
      backend_network:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8545 || curl -f http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  besu-data-validator1:
  besu-data-validator2:
  besu-data-validator3:
  besu-data-validator4:
  besu-data-rpc:

version: '3.8'

services:
  besu-node:
    image: hyperledger/besu:23.10.2
    container_name: besu-dev-node
    command:
      - --network=dev
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,DEBUG,MINER,TXPOOL
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --miner-enabled=true
      - --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
    ports:
      - "8545:8545"
      - "30303:30303"
    volumes:
      - besu-data:/var/lib/besu
    restart: unless-stopped

volumes:
  besu-data:

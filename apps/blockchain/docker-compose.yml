version: '3.8'

networks:
  backend_network:
    driver: bridge
  blockchain_network:
    driver: bridge

services:
  besu-validator1:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator1
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/opt/besu/data
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=besu-validator1
      - --p2p-port=30303
    ports:
      - "30303:30303"
    volumes:
      - besu-data-validator1:/opt/besu/data
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator1/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/data/static-nodes.json
    networks:
      - blockchain_network
    restart: unless-stopped

  besu-validator2:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator2
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/opt/besu/data
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=besu-validator2
      - --p2p-port=30303
    ports:
      - "30304:30303"
    volumes:
      - besu-data-validator2:/opt/besu/data
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator2/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/data/static-nodes.json
    networks:
      - blockchain_network
    restart: unless-stopped

  besu-validator3:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator3
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/opt/besu/data
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=besu-validator3
      - --p2p-port=30303
    ports:
      - "30305:30303"
    volumes:
      - besu-data-validator3:/opt/besu/data
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator3/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/data/static-nodes.json
    networks:
      - blockchain_network
    restart: unless-stopped

  besu-validator4:
    image: hyperledger/besu:23.10.2
    container_name: besu-validator4
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/opt/besu/data
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=besu-validator4
      - --p2p-port=30303
    ports:
      - "30306:30303"
    volumes:
      - besu-data-validator4:/opt/besu/data
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/validator4/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/data/static-nodes.json
    networks:
      - blockchain_network
    restart: unless-stopped

  besu-rpc:
    image: hyperledger/besu:23.10.2
    container_name: besu-rpc
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --data-path=/opt/besu/data
      - --discovery-enabled=false
      - --p2p-enabled=true
      - --p2p-host=besu-rpc
      - --p2p-port=30303
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=*
      - --host-allowlist=localhost,besu-rpc,backend,127.0.0.1
    ports:
      - "8545:8545"
      - "30307:30303"
    volumes:
      - besu-data-rpc:/opt/besu/data
      - ./genesis/genesis.json:/opt/besu/genesis.json
      - ./configs/rpc/key:/opt/besu/key
      - ./configs/static-nodes.json:/opt/besu/data/static-nodes.json
    networks:
      - blockchain_network
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8545 || curl -f http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  besu-data-validator1:
  besu-data-validator2:
  besu-data-validator3:
  besu-data-validator4:
  besu-data-rpc:
